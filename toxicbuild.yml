language: python
docker: true

versions:
  - '3.11'
  - '3.12'
  - '3.13'

extra_indexes:
  - 'https://pypi.poraodojuca.dev'

system_packages:
  - make

steps:
  - name: setup test env
    command: ./scripts/env.sh

  - name: Linter checks
    command: ./scripts/run_linter.sh

  - name: Code complexity checks
    command: xenon toxicpoller -b B

  - name: Unit tests & coverage
    command: ./scripts/check_coverage.sh

  - name: Functional tests
    command: pytest tests/functional



builders:
  - name: Docs & Release
    branches:
      - release

    platform: python3.13

    envvars:
      ENV: ci

    plugins:
      - name: apt-install
        packages:
          - build-essential
          - curl

      - name: python-venv
        pyversion: python3.13

    steps:
      - name: Build docs
        command: ./scripts/build_docs.sh
        stop_on_fail: true

      - name: Build package
        command: ./scripts/build_package.sh
        stop_on_fail: true

      - name: upload docs to pdj pypi
        command: ./scripts/release.sh

      - name: upload docs
        command: ./scripts/upload_docs.sh
